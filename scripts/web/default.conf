server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /search {
        default_type text/plain;
        return 200 "Search query: $arg_q\n";
    }
}
